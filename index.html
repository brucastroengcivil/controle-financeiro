<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Controle Financeiro</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Financeiro" />
<link rel="apple-touch-icon" href="icon-192.png" />
<link rel="icon" href="icon-192.png" />
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
  :root {
    --bg: #f3f4f8;
    --panel: #ffffff;
    --panel-2: #f4f5f9;
    --border: #e6e8f0;
    --text: #1a1d2b;
    --text-dim: #6b7280;
    --brl: #16a34a;
    --pen: #d97706;
    --danger: #dc2626;
    --gold: #4f46e5;
    --gold-dim: #eef0fd;
    --shadow: 0 1px 2px rgba(20,22,40,0.04), 0 4px 14px rgba(20,22,40,0.05);
  }
  body.theme-dark {
    --bg: #12161d;
    --panel: #1a2029;
    --panel-2: #202836;
    --border: rgba(255,255,255,0.09);
    --text: #ece8de;
    --text-dim: #8d94a3;
    --brl: #55b28d;
    --pen: #e2984f;
    --danger: #e0637a;
    --gold: #cba15e;
    --gold-dim: rgba(203,161,94,0.15);
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 4px 14px rgba(0,0,0,0.25);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); }
  body { font-family: 'Inter', sans-serif; color: var(--text); }
  input, select, button, textarea { font-family: 'Inter', sans-serif; }
  input[type=date]::-webkit-calendar-picker-indicator { filter: invert(0.45); }
  input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text);
    -webkit-box-shadow: 0 0 0px 1000px var(--panel-2) inset;
    box-shadow: 0 0 0px 1000px var(--panel-2) inset;
    transition: background-color 9999s ease-in-out 0s;
    caret-color: var(--text);
  }
  ::-webkit-scrollbar { width: 0; height: 0; }
  @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  #app-shell {
    height: 100vh;
    height: 100dvh;
    max-width: 460px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    background: var(--bg);
  }
  header {
    display: flex; justify-content: space-between; align-items: flex-end;
    padding: 22px 18px 14px; padding-top: calc(22px + env(safe-area-inset-top));
    border-bottom: 1px solid var(--border);
    background: var(--panel);
    flex-shrink: 0;
  }
  .header-title { font-family: 'Inter', sans-serif; font-size: 19px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: center; gap: 9px; }
  .header-version { font-size: 10px; font-weight: 600; color: var(--text-dim); margin-left: 2px; }
  .header-logo {
    width: 30px; height: 30px; border-radius: 9px; background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800; flex-shrink: 0;
  }
  .header-subtitle { font-size: 12px; color: var(--text-dim); margin-top: 2px; display: flex; align-items: center; padding-left: 39px; }
  .sync-dot-wrap { display: inline-flex; align-items: center; gap: 5px; margin-left: 8px; font-size: 10.5px; }
  .sync-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; }
  .header-right { display: flex; align-items: center; gap: 8px; }
  .refresh-btn {
    background: var(--panel-2); border: 1px solid var(--border); color: var(--text-dim);
    border-radius: 8px; width: 30px; height: 30px; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .refresh-btn svg { width: 14px; height: 14px; }
  .refresh-btn.loading svg { animation: spin 0.8s linear infinite; }
  .header-badge {
    font-family: 'IBM Plex Mono', monospace; font-size: 13px; display: flex; gap: 6px;
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 20px; padding: 5px 12px;
  }
  main { flex: 1; min-height: 0; padding: 16px 16px 20px; overflow-y: auto; -webkit-overflow-scrolling: touch; }

  .section-label { font-size: 12.5px; color: var(--text-dim); margin: 18px 2px 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }

  .segmented { display: flex; background: var(--panel-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; }
  .segmented button {
    flex: 1; padding: 8px 0; border: none; border-radius: 7px; background: transparent;
    color: var(--text-dim); font-size: 13.5px; font-weight: 500; cursor: pointer;
  }
  .segmented button.active { background: var(--panel); color: var(--text); box-shadow: var(--shadow); }

  .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .balance-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px 15px; box-shadow: var(--shadow); }
  .balance-card-name { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .balance-card-value { font-family: 'IBM Plex Mono', monospace; font-size: 16px; font-weight: 600; }

  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kpi-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; box-shadow: var(--shadow); }
  .kpi-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
  .kpi-label { font-size: 10.5px; font-weight: 700; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; }
  .kpi-icon { width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .kpi-icon svg { width: 15px; height: 15px; }
  .kpi-value { font-family: 'IBM Plex Mono', monospace; font-size: 19px; font-weight: 700; }
  .kpi-sub { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .kpi-delta { font-weight: 700; padding: 1px 5px; border-radius: 5px; font-size: 10.5px; }
  .kpi-delta.up { color: var(--brl); background: #ecfdf3; }
  .kpi-delta.down { color: var(--danger); background: #fef2f2; }

  .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }

  .total-strip { display: flex; justify-content: space-between; background: var(--panel-2); border: 1px solid var(--border);
    border-radius: 12px; padding: 12px 14px; margin-top: 10px; gap: 6px; }
  .total-strip-label { display: block; font-size: 10.5px; color: var(--text-dim); margin-bottom: 3px; }
  .total-strip-value { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 600; }

  .chart-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px 12px; margin-top: 4px; box-shadow: var(--shadow); }
  .chart-card-title { font-size: 14px; font-weight: 700; margin-bottom: 2px; }
  .chart-card-sub { font-size: 11.5px; color: var(--text-dim); margin-bottom: 10px; }
  .chart-svg-wrap { position: relative; width: 100%; }
  .chart-svg-wrap svg { touch-action: none; }
  .chart-tooltip {
    position: absolute; pointer-events: none; background: var(--text); border: none;
    border-radius: 6px; padding: 5px 9px; font-size: 11px; font-family: 'IBM Plex Mono', monospace;
    color: #fff; white-space: nowrap; transform: translate(-50%, -125%); z-index: 5; box-shadow: var(--shadow);
  }
  .extreme-card { background: var(--panel-2); border: 1.5px solid var(--border); border-radius: 14px; padding: 14px 16px; }
  .extreme-card-value { font-family: 'IBM Plex Mono', monospace; font-size: 22px; font-weight: 700; }
  .extreme-card-date { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  .donut-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .donut-legend { flex: 1; min-width: 160px; display: flex; flex-direction: column; gap: 8px; }
  .donut-legend-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; }
  .donut-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .donut-legend-name { flex: 1; color: var(--text); }
  .donut-legend-value { font-family: 'IBM Plex Mono', monospace; font-weight: 600; font-size: 12px; }
  .donut-legend-pct { color: var(--text-dim); font-size: 11px; width: 34px; text-align: right; }
  .donut-center-value { font-family: 'IBM Plex Mono', monospace; font-weight: 700; font-size: 15px; }
  .donut-center-label { font-size: 9.5px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.03em; }

  .ledger-list { display: flex; flex-direction: column; gap: 6px; }
  .ledger-group { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .ledger-group-header {
    display: flex; align-items: center; gap: 8px; width: 100%; background: none; border: none;
    padding: 10px 12px; cursor: pointer; color: var(--text); text-align: left;
  }
  .ledger-group-date { font-size: 13px; font-weight: 600; }
  .ledger-group-count { font-size: 11px; color: var(--text-dim); flex: 1; }
  .ledger-group-items { border-top: 1px solid var(--border); display: flex; flex-direction: column; }
  .ledger-group-items .ledger-row { border-radius: 0; border: none; border-bottom: 1px solid var(--border); box-shadow: none; }
  .ledger-group-items .ledger-row:last-child { border-bottom: none; }
  .expand-collapse-row { display: flex; gap: 14px; margin: 8px 2px 6px; }
  .link-btn { background: none; border: none; color: var(--gold); font-size: 11.5px; padding: 0; cursor: pointer; font-weight: 600; }
  .ledger-row { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; box-shadow: var(--shadow); }
  .ledger-top-line { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .ledger-desc { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .ledger-meta { font-size: 11px; font-family: 'IBM Plex Mono', monospace; color: var(--text-dim); margin-top: 4px; }
  .ledger-value { font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }

  .empty-state { color: var(--text-dim); font-size: 13px; padding: 26px 10px; text-align: center; border: 1px dashed var(--border); border-radius: 12px; }

  .filter-row { display: flex; gap: 8px; margin-bottom: 4px; }
  .search-input {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 9px;
    padding: 9px 12px; font-size: 16px; width: 100%; margin-bottom: 8px;
  }
  .search-input::placeholder { color: var(--text-dim); }
  select {
    background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 8px; font-size: 16px; flex: 1; min-width: 0;
  }
  .add-btn {
    display: flex; align-items: center; gap: 5px; background: var(--gold); color: #fff; border: none;
    border-radius: 9px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    box-shadow: 0 1px 2px rgba(79,70,229,0.25);
  }
  body.theme-dark .add-btn { color: #1a1406; box-shadow: none; }
  .cancel-btn { background: var(--panel); color: var(--text-dim); border: 1px solid var(--border); border-radius: 9px; padding: 8px 14px; font-size: 12.5px; cursor: pointer; }

  .form-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 14px; margin: 10px 0 4px; display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); }
  .form-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

  .item-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
  .item-top { display: flex; align-items: center; gap: 10px; padding: 10px 12px; cursor: pointer; }
  .item-mid { flex: 1; min-width: 0; }
  .check-btn { background: none; border: none; color: var(--text-dim); padding: 0; display: flex; cursor: pointer; }
  .check-btn.on { color: var(--brl); }
  .check-btn svg { width: 20px; height: 20px; }
  .chevron { color: var(--text-dim); width: 16px; height: 16px; transition: transform .15s; flex-shrink: 0; }
  .chevron.open { transform: rotate(180deg); }
  .item-detail { border-top: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 10px; }

  .field-row { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field-label { font-size: 11.5px; color: var(--text-dim); }
  input[type=text], input[type=number], input[type=date], input[type=password] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 8px 10px; font-size: 16px; width: 100%; min-width: 0; box-sizing: border-box; display: block;
  }
  input[type=date] { max-width: 100%; }
  .delete-btn { display: flex; align-items: center; gap: 6px; background: none; border: none; color: var(--danger);
    font-size: 12.5px; padding: 4px 0; cursor: pointer; align-self: flex-start; }
  .delete-btn svg { width: 14px; height: 14px; }

  .rate-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px 12px; margin-bottom: 12px; box-shadow: var(--shadow); }
  .rate-label { font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
  .rate-row { display: flex; align-items: center; gap: 8px; }
  .rate-meta-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 8px; }
  .rate-meta-text { font-size: 10.5px; flex: 1; }
  .rate-text { font-size: 13.5px; color: var(--text-dim); }

  .account-card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
  .add-account-btn { display: flex; align-items: center; gap: 6px; background: none; border: 1px dashed var(--border); color: var(--text-dim);
    border-radius: 10px; padding: 10px 0; justify-content: center; font-size: 12.5px; width: 100%; cursor: pointer; }
  .add-account-btn svg { width: 15px; height: 15px; }

  .backup-row { display: flex; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
  .backup-btn { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; gap: 5px; background: var(--panel-2);
    border: 1px solid var(--border); color: var(--text-dim); border-radius: 8px; padding: 7px 8px; font-size: 11px; font-weight: 500; cursor: pointer; white-space: nowrap; }
  .backup-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

  .login-wrap {
    display: flex; align-items: center; justify-content: center; min-height: 100%; padding: 20px;
    padding-top: calc(20px + env(safe-area-inset-top));
  }
  body.login-mode {
    background: radial-gradient(ellipse at 30% 20%, #2f2f6b 0%, #14162e 45%, #0c0d1f 100%);
  }
  body.login-mode #app-shell { max-width: none; background: transparent; }
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(20,22,35,0.45); display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .modal-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; width: 100%; max-width: 340px; box-shadow: 0 12px 40px rgba(20,22,40,0.18); }
  .login-card { background: var(--panel); border: 1px solid var(--border); border-radius: 20px; padding: 32px 26px; width: 100%; max-width: 360px; box-shadow: 0 24px 60px rgba(0,0,0,0.35); text-align: center; }
  .login-logo {
    width: 64px; height: 64px; border-radius: 50%; background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 22px; font-weight: 800;
    margin: 0 auto 18px; box-shadow: 0 8px 20px rgba(79,70,229,0.35);
  }
  .login-title { font-size: 22px; font-weight: 800; letter-spacing: -0.01em; }
  .login-subtitle { font-size: 13px; color: var(--text-dim); margin-top: 4px; margin-bottom: 22px; }
  .login-field-row { text-align: left; margin-bottom: 14px; }
  .login-field-row .field-label { font-weight: 600; color: var(--text); font-size: 12.5px; margin-bottom: 6px; }
  .password-wrap { position: relative; }
  .password-wrap input { padding-right: 40px; }
  .password-toggle {
    position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none;
    color: var(--text-dim); cursor: pointer; display: flex; padding: 4px;
  }
  .password-toggle svg { width: 18px; height: 18px; }
  .login-forgot-link { display: block; text-align: center; color: var(--gold); font-size: 13px; font-weight: 600; margin-top: 16px; background: none; border: none; cursor: pointer; width: 100%; }

  .fab-backdrop { position: fixed; inset: 0; z-index: 44; background: transparent; }
  .fab-wrap { position: fixed; right: 20px; bottom: calc(78px + env(safe-area-inset-bottom)); z-index: 45; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  .fab-btn {
    width: 56px; height: 56px; border-radius: 50%; background: var(--gold); color: #fff; border: none;
    display: flex; align-items: center; justify-content: center; box-shadow: 0 8px 20px rgba(0,0,0,0.28); cursor: pointer;
    transition: transform 0.18s;
  }
  body.theme-dark .fab-btn { color: #1a1406; }
  .fab-btn svg { width: 26px; height: 26px; }
  .fab-btn.open { transform: rotate(45deg); }
  .fab-menu { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .fab-menu-item {
    display: flex; align-items: center; gap: 8px; background: var(--panel); color: var(--text); border: 1px solid var(--border);
    border-radius: 11px; padding: 10px 14px; font-size: 13px; font-weight: 600; box-shadow: var(--shadow); cursor: pointer; white-space: nowrap;
  }
  .fab-menu-item svg { width: 16px; height: 16px; }

  nav.tab-bar {
    display: flex; justify-content: space-around; background: var(--panel); border-top: 1px solid var(--border);
    padding: 8px 4px calc(8px + env(safe-area-inset-bottom)); flex-shrink: 0;
  }
  .tab-btn { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 4px 10px; color: var(--text-dim); border-radius: 8px; }
  .tab-btn.active { color: var(--gold); }
  .tab-btn svg { width: 20px; height: 20px; }
  .tab-btn-label { font-size: 10.5px; }

  /* ---------- responsivo: tablet e desktop ---------- */
  @media (min-width: 700px) {
    #app-shell { max-width: 760px; }
    header { padding-left: 26px; padding-right: 26px; }
    main { padding: 22px 26px 26px; }
    .kpi-grid { grid-template-columns: repeat(4, 1fr); }
    .balance-grid { grid-template-columns: repeat(3, 1fr); }
  }

  @media (min-width: 1000px) {
    #app-shell { max-width: 1180px; height: auto; min-height: 100vh; min-height: 100dvh; overflow: visible; }
    body { overflow-y: auto; }
    main { overflow-y: visible; padding: 26px 32px 40px; order: 2; }
    header { padding-left: 32px; padding-right: 32px; position: sticky; top: 0; z-index: 30; order: 0; }

    /* barra de navegação some embaixo e vira uma barra horizontal no topo, logo abaixo do cabeçalho */
    nav.tab-bar {
      order: 1;
      flex-direction: row;
      justify-content: flex-start;
      gap: 4px;
      border-top: none;
      border-bottom: 1px solid var(--border);
      padding: 10px 32px;
      position: sticky;
      z-index: 25;
    }
    .tab-btn { flex-direction: row; padding: 8px 14px; }
    .tab-btn.active { background: var(--gold-dim); }
    .tab-btn-label { font-size: 13px; }

    .fab-wrap { bottom: 24px; }

    .dashboard-grid { grid-template-columns: 1.3fr 1fr; align-items: start; }
    .balance-grid { grid-template-columns: repeat(5, 1fr); }
  }
</style>
</head>
<body>
<div id="app-shell"></div>
<script>
/* ---------------------------------------------------------------------- *
 *  Controle Financeiro — R$ / PEN — versão HTML autônoma (PWA)
 *  Sincroniza via Firebase Firestore (tempo real + persistência offline).
 * ---------------------------------------------------------------------- */

const APP_VERSION = "1.3"; // versão curta mostrada ao lado do título — suba junto com o APP_BUILD abaixo
const APP_BUILD = "2026-09-19.5"; // mude este valor a cada atualização, para conferir no app se a versão é a mais recente

const firebaseConfig = {
  apiKey: "AIzaSyAx6CD4hD9gD-r9kTL3nfAbE1Qg-w2LyTw",
  authDomain: "controle-financeiro-7f66e.firebaseapp.com",
  databaseURL: "https://controle-financeiro-7f66e-default-rtdb.firebaseio.com",
  projectId: "controle-financeiro-7f66e",
  storageBucket: "controle-financeiro-7f66e.firebasestorage.app",
  messagingSenderId: "1035634621982",
  appId: "1:1035634621982:web:d6deb418a42e86488d780f",
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
try {
  db.enablePersistence({ synchronizeTabs: true }).catch((err) => {
    console.warn("Persistência offline não disponível:", err.code);
  });
} catch (e) {

const addDaysStr = (dateStr, days) => {
  const d = new Date(dateStr + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
};
const addMonthsClampedStr = (dateStr, months) => {
  const [y, m, day] = dateStr.split("-").map(Number);
  const target = new Date(Date.UTC(y, m - 1 + months, 1));
  const lastDay = new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth() + 1, 0)).getUTCDate();
  const finalDay = Math.min(day, lastDay);
  return new Date(Date.UTC(target.getUTCFullYear(), target.getUTCMonth(), finalDay)).toISOString().slice(0, 10);
};
function generateRecurringDates(start, end, freq) {
  const dates = [];
  let i = 0;
  let cursor = start;
  while (cursor <= end && i < 500) {
    dates.push(cursor);
    i++;
    cursor = freq === "weekly" ? addDaysStr(start, i * 7) : addMonthsClampedStr(start, i);
  }
  return dates;
}

function csvEscape(value) {
  const s = String(value ?? "");
  if (/[",\n;]/.test(s)) return `"${s.replace(/"/g, '""')}"`;
  return s;
}

function buildCsvExport() {
  const accountIndex = buildAccountIndex(state.accounts);
  const header = ["Tipo", "Descrição", "Conta", "Moeda", "Valor", "Data", "Status", "DataEfetivacao", "SaldoInicial", "DataInicial", "Taxa"];
  const rows = [header];

  [...state.accounts.BRL, ...state.accounts.PEN].forEach((a) => {
    const currency = state.accounts.PEN.includes(a) ? "PEN" : "BRL";
    rows.push(["Conta", a.name, "", currency, "", "", "", "", a.initial, a.initialDate, ""]);
  });

  rows.push(["Câmbio", "1 PEN em BRL", "", "", "", "", "", "", "", "", state.rate]);

  state.despesas.forEach((d) => {
    rows.push(["Despesa", d.description, d.account, accountIndex[d.account]?.currency || "BRL", d.value, d.dueDate, d.done ? "Pago" : "Pendente", d.doneDate || "", "", "", ""]);
  });
  state.receitas.forEach((r) => {
    rows.push(["Receita", r.description, r.account, accountIndex[r.account]?.currency || "BRL", r.value, r.dueDate, r.done ? "Recebido" : "Pendente", r.doneDate || "", "", "", ""]);
  });

  return rows.map((row) => row.map(csvEscape).join(",")).join("\r\n");
}

function parseCsvLines(text) {
  // parser simples de CSV que respeita campos entre aspas (com vírgulas/quebras de linha dentro)
  const rows = [];
  let row = [];
  let field = "";
  let inQuotes = false;
  const clean = text.replace(/^\uFEFF/, "");
  for (let i = 0; i < clean.length; i++) {
    const c = clean[i];
    if (inQuotes) {
      if (c === '"') {
        if (clean[i + 1] === '"') {
          field += '"';
          i++;
        } else {
          inQuotes = false;
        }
      } else {
        field += c;
      }
    } else if (c === '"') {
      inQuotes = true;
    } else if (c === ",") {
      row.push(field);
      field = "";
    } else if (c === "\r") {
      // ignora, o \n cuida da quebra
    } else if (c === "\n") {
      row.push(field);
      rows.push(row);
      row = [];
      field = "";
    } else {
      field += c;
    }
  }
  if (field.length > 0 || row.length > 0) {
    row.push(field);
    rows.push(row);
  }
  return rows.filter((r) => r.some((c) => c.trim() !== ""));
}

function parseCsvImport(text) {
  const rows = parseCsvLines(text);
  if (rows.length === 0) return { novasDespesas: [], novasReceitas: [], contasUpsert: [], novaTaxa: null, ignoradas: 0 };

  const header = rows[0].map((h) => h.trim().toLowerCase());
  const idx = {
    tipo: header.findIndex((h) => h.includes("tipo")),
    descricao: header.findIndex((h) => h.includes("descri")),
    conta: header.findIndex((h) => h.includes("conta")),
    moeda: header.findIndex((h) => h.includes("moeda")),
    valor: header.findIndex((h) => h.includes("valor")),
    data: header.findIndex((h) => h === "data"),
    status: header.findIndex((h) => h.includes("status")),
    dataEfetivacao: header.findIndex((h) => h.includes("efet")),
    saldoInicial: header.findIndex((h) => h.includes("saldoinicial")),
    dataInicial: header.findIndex((h) => h.includes("datainicial")),
    taxa: header.findIndex((h) => h.includes("taxa")),
  };

  const novasDespesas = [];
  const novasReceitas = [];
  const contasUpsert = [];
  let novaTaxa = null;
  let ignoradas = 0;

  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    const tipo = (r[idx.tipo] || "").trim().toLowerCase();

    if (tipo === "conta") {
      const name = (r[idx.descricao] || "").trim();
      const currency = (r[idx.moeda] || "BRL").trim().toUpperCase() === "PEN" ? "PEN" : "BRL";
      const initial = parseFloat((r[idx.saldoInicial] || "0").replace(",", ".")) || 0;
      const initialDate = (r[idx.dataInicial] || "").trim();
      if (!name || !/^\d{4}-\d{2}-\d{2}$/.test(initialDate)) {
        ignoradas++;
        continue;
      }
      contasUpsert.push({ name, currency, initial, initialDate });
      continue;
    }

    if (tipo === "câmbio" || tipo === "cambio") {
      const taxa = parseFloat((r[idx.taxa] || "").replace(",", "."));
      if (!isNaN(taxa) && taxa > 0) novaTaxa = taxa;
      continue;
    }

    const dueDate = (r[idx.data] || "").trim();
    const description = (r[idx.descricao] || "").trim();
    const account = (r[idx.conta] || "").trim();
    const value = parseFloat((r[idx.valor] || "0").replace(",", "."));
    const statusRaw = (r[idx.status] || "").trim().toLowerCase();
    const doneDate = (r[idx.dataEfetivacao] || "").trim() || null;

    const isValidDate = /^\d{4}-\d{2}-\d{2}$/.test(dueDate);
    if (!isValidDate || !description || !account || !value) {
      ignoradas++;
      continue;
    }

    const isReceita = tipo.includes("receita");
    const done = statusRaw.includes("pago") || statusRaw.includes("receb");
    const item = {
      id: uid(isReceita ? "receita" : "despesa"),
      account,
      description,
      dueDate,
      value: Math.abs(value),
      done,
      doneDate: done ? doneDate || dueDate : null,
    };
    if (isReceita) novasReceitas.push(item);
    else novasDespesas.push(item);
  }

  return { novasDespesas, novasReceitas, contasUpsert, novaTaxa, ignoradas };
}

const fmtBRL = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL" });
const fmtPEN = new Intl.NumberFormat("es-PE", { style: "currency", currency: "PEN" });

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function buildAccountIndex(accounts) {
  const idx = {};
  accounts.BRL.forEach((a) => (idx[a.name] = { ...a, currency: "BRL" }));
  accounts.PEN.forEach((a) => (idx[a.name] = { ...a, currency: "PEN" }));
  return idx;
}

function computeBalancesAt(accounts, despesas, receitas, mode, atDate) {
  const bal = {};
  [...accounts.BRL, ...accounts.PEN].forEach((a) => {
    bal[a.name] = a.initialDate <= atDate ? a.initial : 0;
  });
  despesas.forEach((d) => {
    const date = mode === "real" ? (d.done ? d.doneDate || d.dueDate : null) : d.dueDate;
    if (date && date <= atDate) bal[d.account] = (bal[d.account] || 0) - d.value;
  });
  receitas.forEach((r) => {
    const date = mode === "real" ? (r.done ? r.doneDate || r.dueDate : null) : r.dueDate;
    if (date && date <= atDate) bal[r.account] = (bal[r.account] || 0) + r.value;
  });
  return bal;
}

function totalsFromBalances(accounts, bal, rate) {
  const brl = accounts.BRL.reduce((s, a) => s + (bal[a.name] || 0), 0);
  const pen = accounts.PEN.reduce((s, a) => s + (bal[a.name] || 0), 0);
  return { brl, pen, totalBRL: brl + pen * rate };
}

let despesasColRef = null;

/* aplica mudanças localmente (para resposta instantânea) e re-renderiza */
function applyLocal(fn) {
  fn();
  render();
}

/* grava um lote de operações no Firestore, em pedaços de até 400 (limite do Firestore é 500) */
async function commitOpsChunked(ops) {
  const CHUNK = 400;
  for (let i = 0; i < ops.length; i += CHUNK) {
    const batch = db.batch();
    ops.slice(i, i + CHUNK).forEach((op) => {
      if (op.type === "delete") batch.delete(op.ref);
      else batch.set(op.ref, op.data, op.merge ? { merge: true } : {});
    });
    await batch.commit();
  }
}

function commitOps(ops) {
  if (!ops || ops.length === 0) return Promise.resolve();
  return commitOpsChunked(ops).catch((e) => {
    console.error("Falha ao salvar no Firestore", e);
    state.syncStatus = "error";
    render();
  });
}

/* ------------------------------ cotação automática PEN → BRL ------------------------------ */

async function fetchExchangeRate(manual) {
  state.rateFetching = true;
  if (manual) render();
  try {
    const res = await fetch("https://open.er-api.com/v6/latest/PEN");
    const data = await res.json();
    const brl = data && data.rates && data.rates.BRL;
    if (typeof brl !== "number") throw new Error("resposta inesperada da API de câmbio");
    state.rateFetchError = false;
    const newRate = Math.round(brl * 10000) / 10000;
    const newUpdatedAt = new Date().toISOString();
    applyLocal(() => {
      state.rate = newRate;
      state.rateUpdatedAt = newUpdatedAt;
    });
    commitOps([{ ref: docRef, type: "set", data: { rate: newRate, rateUpdatedAt: newUpdatedAt }, merge: true }]);
  } catch (e) {
    console.error("Falha ao buscar cotação automática", e);
    state.rateFetchError = true;
  } finally {
    state.rateFetching = false;
    render();
  }
}

function maybeAutoUpdateRate() {
  const last = state.rateUpdatedAt ? new Date(state.rateUpdatedAt).getTime() : 0;
  if (Date.now() - last > 6 * 60 * 60 * 1000) {
    fetchExchangeRate(false);
  }
}

/* migra usuários antigos (documento único) para o novo modelo, ou semeia um usuário novo */
async function migrateIfNeeded() {
  const snap = await docRef.get();
  if (!snap.exists) {
    const ops = [];
    state.despesas.forEach((d) => ops.push({ ref: despesaDocRef(d.id), type: "set", data: d }));
    state.receitas.forEach((r) => ops.push({ ref: receitaDocRef(r.id), type: "set", data: r }));
    [...state.accounts.BRL.map((a) => ({ ...a, currency: "BRL" })), ...state.accounts.PEN.map((a) => ({ ...a, currency: "PEN" }))].forEach((a) =>
      ops.push({ ref: contaDocRef(a.id), type: "set", data: a })
    );
    ops.push({ ref: docRef, type: "set", data: { rate: state.rate, rateUpdatedAt: null } });
    await commitOpsChunked(ops);
    return;
  }
  const data = snap.data() || {};
  const hasLegacy = Array.isArray(data.despesas) || Array.isArray(data.receitas) || (data.accounts && typeof data.accounts === "object");
  if (!hasLegacy) return;

  const ops = [];
  (data.despesas || []).forEach((d) => ops.push({ ref: despesaDocRef(d.id), type: "set", data: d }));
  (data.receitas || []).forEach((r) => ops.push({ ref: receitaDocRef(r.id), type: "set", data: r }));
  const legacyAccounts = data.accounts || {};
  [...(legacyAccounts.BRL || []).map((a) => ({ ...a, currency: "BRL" })), ...(legacyAccounts.PEN || []).map((a) => ({ ...a, currency: "PEN" }))].forEach((a) =>
    ops.push({ ref: contaDocRef(a.id), type: "set", data: a })
  );
  ops.push({
    ref: docRef,
    type: "set",
    data: {
      rate: data.rate,
      rateUpdatedAt: data.rateUpdatedAt || null,
      despesas: firebase.firestore.FieldValue.delete(),
      receitas: firebase.firestore.FieldValue.delete(),
      accounts: firebase.firestore.FieldValue.delete(),
    },
    merge: true,
  });
  await commitOpsChunked(ops);
}

function checkAllPartsLoaded() {
  if (Object.values(loadedParts).every(Boolean) && !state.ready) {
    state.ready = true;
    render();
    maybeAutoUpdateRate();
  }
}

function attachFirestoreListeners() {
  docRef.onSnapshot(
    { includeMetadataChanges: true },
    (snapshot) => {
      const data = snapshot.data() || {};
      if (typeof data.rate === "number") state.rate = data.rate;
      if (data.rateUpdatedAt) state.rateUpdatedAt = data.rateUpdatedAt;
      state.syncStatus = snapshot.metadata.hasPendingWrites ? "saving" : snapshot.metadata.fromCache ? "offline" : "synced";
      loadedParts.rate = true;
      checkAllPartsLoaded();
      render();
    },
    (error) => {
      console.error("Erro de sincronização (câmbio)", error);
      state.syncStatus = "error";
      loadedParts.rate = true;
      checkAllPartsLoaded();
      render();
    }
  );

  despesasColRef.onSnapshot(
    (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        if (change.type === "removed") {
          state.despesas = state.despesas.filter((d) => d.id !== id);
        } else {
          const item = { ...change.doc.data(), id };
          const idx = state.despesas.findIndex((d) => d.id === id);
          if (idx === -1) state.despesas.push(item);
          else state.despesas[idx] = item;
        }
      });
      loadedParts.despesas = true;
      checkAllPartsLoaded();
      render();
    },
    (error) => console.error("Erro de sincronização (despesas)", error)
  );

  receitasColRef.onSnapshot(
    (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        if (change.type === "removed") {
          state.receitas = state.receitas.filter((r) => r.id !== id);
        } else {
          const item = { ...change.doc.data(), id };
          const idx = state.receitas.findIndex((r) => r.id === id);
          if (idx === -1) state.receitas.push(item);
          else state.receitas[idx] = item;
        }
      });
      loadedParts.receitas = true;
      checkAllPartsLoaded();
      render();
    },
    (error) => console.error("Erro de sincronização (receitas)", error)
  );

  contasColRef.onSnapshot(
    (snapshot) => {
      snapshot.docChanges().forEach((change) => {
        const id = change.doc.id;
        state.accounts.BRL = state.accounts.BRL.filter((a) => a.id !== id);
        state.accounts.PEN = state.accounts.PEN.filter((a) => a.id !== id);
        if (change.type !== "removed") {
          const data = change.doc.data();
          const item = { id, name: data.name, initial: data.initial, initialDate: data.initialDate };
          (data.currency === "PEN" ? state.accounts.PEN : state.accounts.BRL).push(item);
        }
      });
      loadedParts.contas = true;
      checkAllPartsLoaded();
      render();
    },
    (error) => console.error("Erro de sincronização (contas)", error)
  );
}

async function startFirestoreSync() {
  despesasColRef = docRef.collection("despesas");
  receitasColRef = docRef.collection("receitas");
  contasColRef = docRef.collection("contas");
  loadedParts = { rate: false, despesas: false, receitas: false, contas: false };

  try {
    await migrateIfNeeded();
  } catch (e) {
    console.error("Falha ao migrar/semear dados iniciais", e);
  }

  attachFirestoreListeners();
}

function computeMonthlyKPIs() {
  const accounts = state.accounts;
  const now = new Date();
  const curYear = now.getFullYear();
  const curMonth = now.getMonth();
  const prev = new Date(Date.UTC(curYear, curMonth - 1, 1));
  const prevYear = prev.getUTCFullYear();
  const prevMonth = prev.getUTCMonth();

  function sumInMonth(list, year, month) {
    let brl = 0,
      pen = 0;
    const accountIndex = buildAccountIndex(accounts);
    list.forEach((it) => {
      if (!it.done || !it.doneDate) return;
      const d = new Date(it.doneDate + "T00:00:00Z");
      if (d.getUTCFullYear() !== year || d.getUTCMonth() !== month) return;
      const cur = accountIndex[it.account]?.currency || "BRL";
      if (cur === "PEN") pen += it.value;
      else brl += it.value;
    });
    return { brl, pen, totalBRL: brl + pen * state.rate };
  }

  const receitasMes = sumInMonth(state.receitas, curYear, curMonth);
  const despesasMes = sumInMonth(state.despesas, curYear, curMonth);
  const receitasMesAnt = sumInMonth(state.receitas, prevYear, prevMonth);
  const despesasMesAnt = sumInMonth(state.despesas, prevYear, prevMonth);

  const economiaMes = receitasMes.totalBRL - despesasMes.totalBRL;
  const taxaPoupanca = receitasMes.totalBRL > 0 ? Math.round((economiaMes / receitasMes.totalBRL) * 100) : 0;

  function pctChange(cur, prev) {
    if (prev === 0) return null;
    return Math.round(((cur - prev) / prev) * 100);
  }

  return {
    receitasMes,
    despesasMes,
    economiaMes,
    taxaPoupanca,
    receitasDelta: pctChange(receitasMes.totalBRL, receitasMesAnt.totalBRL),
    despesasDelta: pctChange(despesasMes.totalBRL, despesasMesAnt.totalBRL),
  };
}

function buildDonutSvg(slices) {
  const total = slices.reduce((s, x) => s + x.value, 0);
  const R = 46,
    CX = 60,
    CY = 60,
    STROKE = 20;
  const circumference = 2 * Math.PI * R;
  if (total <= 0) {
    return `<svg viewBox="0 0 120 120" style="width:120px;height:120px;flex-shrink:0">
      <circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="var(--border)" stroke-width="${STROKE}"/>
    </svg>`;
  }
  let offset = 0;
  const arcs = slices
    .map((s) => {
      const frac = s.value / total;
      const len = frac * circumference;
      const dash = `${len.toFixed(2)} ${(circumference - len).toFixed(2)}`;
      const el = `<circle cx="${CX}" cy="${CY}" r="${R}" fill="none" stroke="${s.color}" stroke-width="${STROKE}"
        stroke-dasharray="${dash}" stroke-dashoffset="${(-offset).toFixed(2)}" transform="rotate(-90 ${CX} ${CY})"/>`;
      offset += len;
      return el;
    })
    .join("");
  return `<svg viewBox="0 0 120 120" style="width:120px;height:120px;flex-shrink:0">${arcs}</svg>`;
}

function renderGroupedLedger(rows) {
  const groups = [];
  let currentGroup = null;
  rows.forEach((row) => {
    if (!currentGroup || currentGroup.date !== row.date) {
      currentGroup = { date: row.date, items: [] };
      groups.push(currentGroup);
    }
    currentGroup.items.push(row);
  });

  return groups
    .map((g) => {
      const collapsed = state.fluxoCollapsedDates.has(g.date);
      const groupTotal = g.items.reduce((s, r) => s + (r.kind === "despesa" ? -1 : 1) * (r.currency === "PEN" ? r.value * state.rate : r.value), 0);
      return `
      <div class="ledger-group">
        <button class="ledger-group-header" data-action="toggle-date-group" data-date="${g.date}">
          <div class="chevron ${collapsed ? "" : "open"}">${ICONS.chevron}</div>

          <span class="ledger-group-count">${g.items.length} lançamento${g.items.length > 1 ? "s" : ""}</span>
          <span class="ledger-value" style="color:${groupTotal < 0 ? "var(--danger)" : "var(--brl)"}">${groupTotal < 0 ? "-" : "+"}${fmtBRL.format(Math.abs(groupTotal))}</span>
        </button>
        ${
          collapsed
            ? ""
            : `<div class="ledger-group-items">
          ${g.items
            .map(
              (row) => `
          <div class="ledger-row">
            <div class="ledger-top-line">
              <span class="ledger-desc">${esc(row.description)}</span>
              <span class="ledger-value" style="color:${row.kind === "despesa" ? "var(--danger)" : row.currency === "PEN" ? "var(--pen)" : "var(--brl)"}">${row.kind === "despesa" ? "-" : "+"}${fmt(row.value, row.currency)}</span>

            <div class="ledger-meta">${esc(row.account)}</div>

            .join("")}
        </div>`

    })

}

const MONTH_ABBR = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

function buildMonthlyChartData(mode) {
  const today = new Date();
  const todayIso = todayStr();
  const months = [];
  if (mode === "previsto") {
    for (let i = 0; i < 12; i++) months.push(new Date(Date.UTC(today.getFullYear(), today.getMonth() + i, 1)));
  } else {
    for (let i = 11; i >= 0; i--) months.push(new Date(Date.UTC(today.getFullYear(), today.getMonth() - i, 1)));
  }
  return months.map((d) => {
    const year = d.getUTCFullYear();
    const month = d.getUTCMonth();
    const lastDay = new Date(Date.UTC(year, month + 1, 0)).getUTCDate();
    let targetDate = new Date(Date.UTC(year, month, lastDay)).toISOString().slice(0, 10);
    if (mode === "real" && targetDate > todayIso) targetDate = todayIso;
    if (mode === "previsto" && targetDate < todayIso) targetDate = todayIso;
    const bal = computeBalancesAt(state.accounts, state.despesas, state.receitas, mode, targetDate);
    const t = totalsFromBalances(state.accounts, bal, state.rate);
    return {
      date: targetDate,
      label: MONTH_ABBR[month],
      total: Math.round(t.totalBRL * 100) / 100,
    };
  });
}

function findExtremes(data) {
  let min = data[0], max = data[0];
  for (const d of data) {
    if (d.total < min.total) min = d;
    if (d.total > max.total) max = d;
  }
  return { min, max };
}

function buildBalanceChart(data) {
  const W = 400,
    H = 280,
    PAD_X = 12,
    PAD_TOP = 34,
    PAD_BOTTOM = 52;
  const values = data.map((d) => d.total);
  const min = Math.min(...values, 0);
  const max = Math.max(...values, 0);
  const range = max - min || 1;
  const usableH = H - PAD_TOP - PAD_BOTTOM;
  const scaleY = (v) => H - PAD_BOTTOM - ((v - min) / range) * usableH;
  const zeroY = scaleY(0);

  const n = data.length;
  const slotW = (W - PAD_X * 2) / n;

  const points = data.map((d, i) => {
    const cx = PAD_X + slotW * i + slotW / 2;
    return { ...d, cx, valY: scaleY(d.total) };
  });

  const linePath = points.map((p, i) => `${i === 0 ? "M" : "L"}${p.cx.toFixed(1)},${p.valY.toFixed(1)}`).join(" ");
  const areaPath = `${linePath} L${points[points.length - 1].cx.toFixed(1)},${zeroY.toFixed(1)} L${points[0].cx.toFixed(1)},${zeroY.toFixed(1)} Z`;

  // linhas pontilhadas separando cada mês (nas bordas de cada "fatia")
  const monthDividers = [];
  for (let i = 1; i < n; i++) {
    const x = (PAD_X + slotW * i).toFixed(1);
    monthDividers.push(`<line x1="${x}" y1="${PAD_TOP - 6}" x2="${x}" y2="${H - PAD_BOTTOM}" stroke="rgba(255,255,255,0.09)" stroke-width="1" stroke-dasharray="2,3"/>`);
  }

  const monthLabels = points
    .map((p) => {
      const ly = H - PAD_BOTTOM + 10;
      return `<text x="${p.cx.toFixed(1)}" y="${ly}" text-anchor="end" font-size="9.5" fill="var(--text-dim)" font-family="'IBM Plex Mono',monospace" transform="rotate(-90 ${p.cx.toFixed(1)} ${ly})">${p.label}</text>`;
    })
    .join("");

  const { min: minPoint, max: maxPoint } = findExtremes(data);
  const minIdx = data.indexOf(minPoint);
  const maxIdx = data.indexOf(maxPoint);
  const minXY = points[minIdx];
  const maxXY = points[maxIdx];

  const clipId = "clip-" + Math.random().toString(36).slice(2, 8);

  const minLabelAnchor = minXY.cx > W * 0.75 ? "end" : minXY.cx < W * 0.25 ? "start" : "middle";
  const minLabelY = minXY.valY < H / 2 ? minXY.valY + 26 : minXY.valY - 14;

  const maxLabelAnchor = maxXY.cx > W * 0.75 ? "end" : maxXY.cx < W * 0.25 ? "start" : "middle";
  const maxLabelY = maxXY.valY < H / 2 ? maxXY.valY - 10 : maxXY.valY - 10;

  const pointsPayload = JSON.stringify(points.map((p) => ({ x: p.cx, y: p.valY, label: p.label, total: p.total })));

  return `
    <div class="chart-svg-wrap" data-chart-points='${pointsPayload}' data-chart-w="${W}" data-chart-h="${H}">
      <svg class="balance-chart-svg" viewBox="0 0 ${W} ${H}" style="width:100%;height:280px;display:block;overflow:visible">
        <defs>
          <clipPath id="${clipId}-above"><rect x="0" y="0" width="${W}" height="${zeroY.toFixed(1)}"/></clipPath>
          <clipPath id="${clipId}-below"><rect x="0" y="${zeroY.toFixed(1)}" width="${W}" height="${(H - zeroY).toFixed(1)}"/></clipPath>
          <linearGradient id="${clipId}-gpos" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="var(--brl)" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="var(--brl)" stop-opacity="0"/>
          </linearGradient>
          <linearGradient id="${clipId}-gneg" x1="0" y1="1" x2="0" y2="0">
            <stop offset="0%" stop-color="var(--danger)" stop-opacity="0.4"/>
            <stop offset="100%" stop-color="var(--danger)" stop-opacity="0"/>
          </linearGradient>
        </defs>

        ${monthDividers.join("")}

        <line x1="${PAD_X}" y1="${zeroY.toFixed(1)}" x2="${W - PAD_X}" y2="${zeroY.toFixed(1)}" stroke="rgba(255,255,255,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <text x="${W - PAD_X}" y="${(zeroY - 5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--text-dim)" font-family="'IBM Plex Mono',monospace">R$ 0</text>

        <path d="${areaPath}" fill="url(#${clipId}-gpos)" clip-path="url(#${clipId}-above)"/>
        <path d="${areaPath}" fill="url(#${clipId}-gneg)" clip-path="url(#${clipId}-below)"/>
        <path d="${linePath}" fill="none" stroke="var(--brl)" stroke-width="2" clip-path="url(#${clipId}-above)"/>
        <path d="${linePath}" fill="none" stroke="var(--danger)" stroke-width="2" clip-path="url(#${clipId}-below)"/>

        ${points.map((p) => `<circle cx="${p.cx.toFixed(1)}" cy="${p.valY.toFixed(1)}" r="2.5" fill="${p.total >= 0 ? "var(--brl)" : "var(--danger)"}"/>`).join("")}

        ${monthLabels}

        <circle cx="${minXY.cx.toFixed(1)}" cy="${minXY.valY.toFixed(1)}" r="4" fill="var(--bg)" stroke="var(--gold)" stroke-width="2"/>
        <text x="${minXY.cx.toFixed(1)}" y="${minLabelY.toFixed(1)}" text-anchor="${minLabelAnchor}" font-size="10.5" font-weight="600" fill="var(--gold)" font-family="'IBM Plex Mono',monospace">menor: ${fmtBRL.format(minPoint.total)}</text>
        ${
          maxIdx !== minIdx
            ? `<circle cx="${maxXY.cx.toFixed(1)}" cy="${maxXY.valY.toFixed(1)}" r="3" fill="var(--panel)" stroke="var(--text-dim)" stroke-width="1.5"/>
        <text x="${maxXY.cx.toFixed(1)}" y="${maxLabelY.toFixed(1)}" text-anchor="${maxLabelAnchor}" font-size="9" fill="var(--text-dim)" font-family="'IBM Plex Mono',monospace">maior: ${fmtBRL.format(maxPoint.total)}</text>`
            : ""
        }

        <line class="chart-hoverline" x1="0" y1="${PAD_TOP - 10}" x2="0" y2="${H - PAD_BOTTOM}" stroke="var(--text-dim)" stroke-width="1" style="display:none"/>
        <circle class="chart-hoverdot" r="5" fill="var(--gold)" stroke="var(--bg)" stroke-width="1.5" style="display:none"/>
      </svg>
      <div class="chart-tooltip" style="display:none"></div>
    </div>
    <div style="text-align:center;font-size:10.5px;color:var(--text-dim);margin-top:6px">Toque ou passe o dedo sobre o gráfico para ver cada mês</div>`;
}

function bindChartInteractivity(shell) {
  const wrap = shell.querySelector(".chart-svg-wrap");
  if (!wrap) return;
  const svg = wrap.querySelector(".balance-chart-svg");
  const hoverLine = wrap.querySelector(".chart-hoverline");
  const hoverDot = wrap.querySelector(".chart-hoverdot");
  const tooltip = wrap.querySelector(".chart-tooltip");
  if (!svg || !hoverLine || !hoverDot || !tooltip) return;

  const points = JSON.parse(wrap.dataset.chartPoints);
  const W = parseFloat(wrap.dataset.chartW);
  const H = parseFloat(wrap.dataset.chartH);

  function nearestPoint(clientX) {
    const rect = svg.getBoundingClientRect();
    const svgX = ((clientX - rect.left) / rect.width) * W;
    let nearest = points[0],
      dist = Math.abs(points[0].x - svgX);
    for (const p of points) {
      const d = Math.abs(p.x - svgX);
      if (d < dist) {
        nearest = p;
        dist = d;
      }
    }
    return { nearest, rect };
  }

  function showAt(clientX) {
    const { nearest, rect } = nearestPoint(clientX);
    hoverLine.setAttribute("x1", nearest.x);
    hoverLine.setAttribute("x2", nearest.x);
    hoverLine.style.display = "block";
    hoverDot.setAttribute("cx", nearest.x);
    hoverDot.setAttribute("cy", nearest.y);
    hoverDot.style.display = "block";
    tooltip.textContent = `${nearest.label} · ${fmtBRL.format(nearest.total)}`;
    tooltip.style.display = "block";
    const pxX = (nearest.x / W) * rect.width;
    const pxY = (nearest.y / H) * rect.height;
    tooltip.style.left = `${Math.min(Math.max(pxX, 4), rect.width - 4)}px`;
    tooltip.style.top = `${Math.max(pxY, 24)}px`;
  }

  function hide() {
    hoverLine.style.display = "none";
    hoverDot.style.display = "none";
    tooltip.style.display = "none";
  }

  svg.addEventListener("pointerdown", (e) => showAt(e.clientX));
  svg.addEventListener("pointermove", (e) => showAt(e.clientX));
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("pointerup", hide);
  svg.addEventListener("pointercancel", hide);
}

function fmtDateTime(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  const dd = String(d.getDate()).padStart(2, "0");
  const mm = String(d.getMonth() + 1).padStart(2, "0");
  const hh = String(d.getHours()).padStart(2, "0");
  const mi = String(d.getMinutes()).padStart(2, "0");
  return `${dd}/${mm} às ${hh}:${mi}`;
}

function renderLancamentosTab(kind) {
  const isDespesa = kind === "despesa";
  const items = isDespesa ? state.despesas : state.receitas;
  const accountIndex = buildAccountIndex(state.accounts);
  const accountNames = [...state.accounts.BRL, ...state.accounts.PEN].map((a) => a.name);
  const filterYearKey = isDespesa ? "despesasFilterYear" : "receitasFilterYear";
  const filterMonthKey = isDespesa ? "despesasFilterMonth" : "receitasFilterMonth";
  const searchKey = isDespesa ? "despesasSearchText" : "receitasSearchText";
  const searchId = isDespesa ? "despesas-search" : "receitas-search";
  const showFormKey = isDespesa ? "showDespesaForm" : "showReceitaForm";
  const years = [...new Set([_curYear, ...items.map((i) => i.dueDate?.slice(0, 4)).filter(Boolean)])].sort();

  const filtered = items
    .filter((i) => (state[filterYearKey] === "todos" ? true : i.dueDate?.slice(0, 4) === state[filterYearKey]))
    .filter((i) => (state[filterMonthKey] === "todos" ? true : i.dueDate?.slice(5, 7) === state[filterMonthKey]))
    .filter((i) => matchesSearch(i.description, state[searchKey]))
    .sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      return a.dueDate < b.dueDate ? -1 : a.dueDate > b.dueDate ? 1 : 0;
    });

  const doneLabel = isDespesa ? "Pago" : "Recebido";
  const doneDateLabel = isDespesa ? "Data em que pagou" : "Data em que recebeu";
  const title = isDespesa ? "Despesas" : "Receitas";

  return `
    <input type="text" id="${searchId}" class="search-input" data-action="search-text" data-key="${searchKey}"
      placeholder="Buscar por descrição…" value="${esc(state[searchKey])}"/>
    <div class="filter-row">
      <select data-action="lanc-filter-year" data-kind="${kind}">
        <option value="todos" ${state[filterYearKey] === "todos" ? "selected" : ""}>Todo ano</option>
        ${years.map((y) => `<option value="${y}" ${state[filterYearKey] === y ? "selected" : ""}>${y}</option>`).join("")}
      </select>
      <select data-action="lanc-filter-month" data-kind="${kind}">
        <option value="todos" ${state[filterMonthKey] === "todos" ? "selected" : ""}>Todo mês</option>
        ${monthNames.map((m, i) => `<option value="${String(i + 1).padStart(2, "0")}" ${state[filterMonthKey] === String(i + 1).padStart(2, "0") ? "selected" : ""}>${m}</option>`).join("")}
      </select>
      <button class="add-btn" data-action="toggle-form" data-kind="${kind}">${ICONS.plus} Novo</button>
    </div>

    ${state[showFormKey] ? newItemFormHtml(kind, accountNames) : ""}

    <div class="section-label">${title}${filtered.length ? ` · ${filtered.length}` : ""}</div>
    <div class="ledger-list">
      ${
        filtered.length === 0
          ? `<div class="empty-state">Nada por aqui ainda.</div>`
          : filtered.map((item) => lancamentoRowHtml(item, kind, accountIndex[item.account]?.currency || "BRL", doneLabel, doneDateLabel, accountNames)).join("")
      }
    </div>`;
}

              ? `<div class="item-detail">
