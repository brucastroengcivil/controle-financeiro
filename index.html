              <input type="text" value="${esc(a.name)}" data-edit-acc="name" data-currency="${currency}" data-id="${a.id}"/></div>
            <div class="field-row"><div class="field-label">Saldo inicial (${currency === "PEN" ? "S/" : "R$"})</div>
              <input type="number" step="0.01" value="${a.initial}" data-edit-acc="initial" data-currency="${currency}" data-id="${a.id}"/></div>
            <div class="field-row"><div class="field-label">Data do saldo inicial</div>
              <input type="date" value="${a.initialDate}" data-edit-acc="initialDate" data-currency="${currency}" data-id="${a.id}"/></div>
            <button class="delete-btn" data-action="delete-account" data-currency="${currency}" data-id="${a.id}">${ICONS.trash} Remover conta</button>
          </div>`
              : ""
          }
        </div>`;
        })
        .join("")}
      ${accounts.length < 4 ? `<button class="add-account-btn" data-action="add-account" data-currency="${currency}">${ICONS.plus} Adicionar conta</button>` : ""}
    </div>`;
}

/* ------------------------------ main render ------------------------------ */

function adjustStickyNavOffset() {
  const shell = document.getElementById("app-shell");
  const headerEl = shell.querySelector("header");
  const navEl = shell.querySelector("nav.tab-bar");
  if (!headerEl || !navEl) return;
  if (window.innerWidth >= 1000) {
    navEl.style.top = `${headerEl.offsetHeight}px`;
  } else {
    navEl.style.top = "";
  }
}
window.addEventListener("resize", () => adjustStickyNavOffset());

function render() {
  const shell = document.getElementById("app-shell");
  if (!state.ready) {
    shell.innerHTML = `<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-dim)">Carregando…</div>`;
    return;
  }

  // preserva o foco e a posição do cursor de um campo de texto que esteja
  // sendo digitado no momento (ex: busca), já que o render reconstrói o DOM.
  const active = document.activeElement;
  const activeId = active && active.id;
  const selStart = active && typeof active.selectionStart === "number" ? active.selectionStart : null;
  const selEnd = active && typeof active.selectionEnd === "number" ? active.selectionEnd : null;

  // preserva a posição do scroll do conteúdo, já que o render reconstrói o <main>.
  const prevMain = shell.querySelector("main");
  const prevScrollTop = prevMain ? prevMain.scrollTop : 0;

  let body = "";
  if (state.tab === "fluxo") body = renderFluxoTab();
  else if (state.tab === "grafico") body = renderGraficoTab();
  else if (state.tab === "despesas") body = renderLancamentosTab("despesa");
  else if (state.tab === "receitas") body = renderLancamentosTab("receita");
  else if (state.tab === "contas") body = renderContasTab();

  shell.innerHTML = `${renderHeader()}<main>${body}</main>${renderTabBar()}${renderFab()}${renderDoneDateModal()}${renderTransferModal()}`;
  bindEvents();
  adjustStickyNavOffset();

  const newMain = shell.querySelector("main");
  if (newMain && prevScrollTop) newMain.scrollTop = prevScrollTop;

  if (activeId) {
    const el = document.getElementById(activeId);
    if (el && typeof el.focus === "function") {
      el.focus();
      if (selStart !== null && el.setSelectionRange) {
        try {
          el.setSelectionRange(selStart, selEnd);
        } catch (e) {}
      }
    }
  }
}

/* ------------------------------ event binding ------------------------------ */

function bindEvents() {
  const shell = document.getElementById("app-shell");

  function captureNewItemDraft(kind) {
    const form = shell.querySelector(`[data-new-form="${kind}"]`);
    if (!form) return;
    const draft = {};
    form.querySelectorAll("[data-field]").forEach((el) => {
      draft[el.dataset.field] = el.value;
    });
    state.newItemDraft[kind] = draft;
  }

  bindChartInteractivity(shell);

  shell.querySelectorAll('[data-action="set-tab"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      render();
    })
  );

  const refreshBtn = document.getElementById("refresh-btn");
  if (refreshBtn)
    refreshBtn.addEventListener("click", () => {
      db.enableNetwork().catch((e) => console.warn("enableNetwork falhou", e));
    });

  shell.querySelectorAll('[data-action="set-mode"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.fluxoMode = btn.dataset.mode;
      render();
    })
  );

  shell.querySelectorAll('[data-action="set-grafico-mode"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.graficoMode = btn.dataset.mode;
      render();
    })
  );

  shell.querySelectorAll('[data-action="search-text"]').forEach((input) =>
    input.addEventListener("input", (e) => {
      state[input.dataset.key] = e.target.value;
      render();
    })
  );

  const rateInput = shell.querySelector('[data-action="set-rate"]');
  if (rateInput)
    rateInput.addEventListener("change", (e) => {
      const newRate = parseFloat(e.target.value) || 0;
      applyLocal(() => (state.rate = newRate));
      commitOps([{ ref: docRef, type: "set", data: { rate: newRate }, merge: true }]);
    });

  const refreshRateBtn = shell.querySelector('[data-action="refresh-rate"]');
  if (refreshRateBtn) refreshRateBtn.addEventListener("click", () => fetchExchangeRate(true));

  const fluxoYear = shell.querySelector('[data-action="fluxo-filter-year"]');
  if (fluxoYear) fluxoYear.addEventListener("change", (e) => { state.fluxoFilterYear = e.target.value; render(); });
  const fluxoMonth = shell.querySelector('[data-action="fluxo-filter-month"]');
  if (fluxoMonth) fluxoMonth.addEventListener("change", (e) => { state.fluxoFilterMonth = e.target.value; render(); });

  shell.querySelectorAll('[data-action="lanc-filter-year"]').forEach((sel) =>
    sel.addEventListener("change", (e) => {
      state[sel.dataset.kind === "despesa" ? "despesasFilterYear" : "receitasFilterYear"] = e.target.value;
      render();
    })
  );
  shell.querySelectorAll('[data-action="lanc-filter-month"]').forEach((sel) =>
    sel.addEventListener("change", (e) => {
      state[sel.dataset.kind === "despesa" ? "despesasFilterMonth" : "receitasFilterMonth"] = e.target.value;
      render();
    })
  );

  shell.querySelectorAll('[data-action="toggle-form"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const key = btn.dataset.kind === "despesa" ? "showDespesaForm" : "showReceitaForm";
      const wasOpen = state[key];
      state[key] = !wasOpen;
      if (!wasOpen) state.newItemDraft[btn.dataset.kind] = {}; // abrindo do zero: começa limpo
      render();
    })
  );
  shell.querySelectorAll('[data-action="cancel-form"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const key = btn.dataset.kind === "despesa" ? "showDespesaForm" : "showReceitaForm";
      state[key] = false;
      state.newItemDraft[btn.dataset.kind] = {};
      render();
    })
  );
  shell.querySelectorAll('[data-action="set-repeat-mode"]').forEach((sel) =>
    sel.addEventListener("change", (e) => {
      captureNewItemDraft(sel.dataset.kind);
      state.newItemRepeat[sel.dataset.kind] = e.target.value;
      render();
    })
  );

  shell.querySelectorAll('[data-action="toggle-already-done"]').forEach((cb) =>
    cb.addEventListener("change", (e) => {
      captureNewItemDraft(cb.dataset.kind);
      state.newItemAlreadyDone[cb.dataset.kind] = e.target.checked;
      render();
    })
  );

  shell.querySelectorAll('[data-action="submit-form"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const kind = btn.dataset.kind;
      const form = shell.querySelector(`[data-new-form="${kind}"]`);
      const account = form.querySelector('[data-field="account"]').value;
      const description = form.querySelector('[data-field="description"]').value.trim();
      const value = parseFloat(form.querySelector('[data-field="value"]').value) || 0;
      const repeatMode = state.newItemRepeat[kind] || "none";
      const alreadyDone = state.newItemAlreadyDone[kind] || false;
      if (!description) return;

      let dueDates = [];
      if (repeatMode === "none") {
        const dueDate = form.querySelector('[data-field="dueDate"]').value;
        if (!dueDate) return;
        dueDates = [dueDate];
      } else {
        const startDate = form.querySelector('[data-field="startDate"]').value;
        const endDate = form.querySelector('[data-field="endDate"]').value;
        if (!startDate || !endDate || endDate < startDate) return;
        dueDates = generateRecurringDates(startDate, endDate, repeatMode);
        if (dueDates.length === 0) return;
      }

      let doneDate = null;
      if (alreadyDone) {
        doneDate = form.querySelector('[data-field="doneDate"]').value || todayStr();
      }

      const newItems = dueDates.map((dueDate) => ({
        id: uid(kind),
        account,
        description,
        dueDate,
        value,
        done: alreadyDone,
        doneDate: alreadyDone ? doneDate : null,
      }));

      applyLocal(() => {
        const list = kind === "despesa" ? state.despesas : state.receitas;
        list.push(...newItems);
        state[kind === "despesa" ? "showDespesaForm" : "showReceitaForm"] = false;
        state.newItemRepeat[kind] = "none";
        state.newItemAlreadyDone[kind] = false;
        state.newItemDraft[kind] = {};
      });
      commitOps(newItems.map((item) => ({ ref: (kind === "despesa" ? despesaDocRef : receitaDocRef)(item.id), type: "set", data: item })));
    })
  );

  shell.querySelectorAll('[data-action="toggle-open"]').forEach((row) =>
    row.addEventListener("click", (e) => {
      if (e.target.closest('[data-action="toggle-done"]')) return;
      const key = `${row.dataset.kind}-${row.dataset.id}`;
      if (state.openItems.has(key)) state.openItems.delete(key);
      else state.openItems.add(key);
      render();
    })
  );

  shell.querySelectorAll('[data-action="toggle-account-open"]').forEach((row) =>
    row.addEventListener("click", () => {
      const key = `${row.dataset.currency}-${row.dataset.id}`;
      if (state.openAccounts.has(key)) state.openAccounts.delete(key);
      else state.openAccounts.add(key);
      render();
    })
  );

  shell.querySelectorAll('[data-action="toggle-date-group"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const date = btn.dataset.date;
      if (state.fluxoCollapsedDates.has(date)) state.fluxoCollapsedDates.delete(date);
      else state.fluxoCollapsedDates.add(date);
      render();
    })
  );

  const expandAllBtn = shell.querySelector('[data-action="expand-all-dates"]');
  if (expandAllBtn)
    expandAllBtn.addEventListener("click", () => {
      state.fluxoCollapsedDates.clear();
      render();
    });

  const collapseAllBtn = shell.querySelector('[data-action="collapse-all-dates"]');
  if (collapseAllBtn)
    collapseAllBtn.addEventListener("click", () => {
      shell.querySelectorAll('[data-action="toggle-date-group"]').forEach((btn) => state.fluxoCollapsedDates.add(btn.dataset.date));
      render();
    });

  shell.querySelectorAll('[data-action="toggle-done"]').forEach((btn) =>
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const { kind, id } = btn.dataset;
      const list = kind === "despesa" ? state.despesas : state.receitas;
      const item = list.find((i) => i.id === id);
      if (!item) return;
      if (item.done) {
        // desmarcar não precisa de data
        applyLocal(() => {
          item.done = false;
          item.doneDate = null;
        });
        commitOps([{ ref: (kind === "despesa" ? despesaDocRef : receitaDocRef)(id), type: "set", data: { done: false, doneDate: null }, merge: true }]);
      } else {
        state.pendingDoneToggle = { kind, id, date: todayStr() };
        render();
      }
    })
  );

  shell.querySelectorAll('[data-action="cancel-done-date"]').forEach((el) =>
    el.addEventListener("click", () => {
      state.pendingDoneToggle = null;
      render();
    })
  );

  const modalCard = shell.querySelector('[data-action="stop-propagation"]');
  if (modalCard) modalCard.addEventListener("click", (e) => e.stopPropagation());

  const confirmDoneBtn = shell.querySelector('[data-action="confirm-done-date"]');
  if (confirmDoneBtn)
    confirmDoneBtn.addEventListener("click", () => {
      const { kind, id } = state.pendingDoneToggle;
      const chosenDate = document.getElementById("pending-done-date-input").value || todayStr();
      const list = kind === "despesa" ? state.despesas : state.receitas;
      const item = list.find((i) => i.id === id);
      applyLocal(() => {
        if (item) {
          item.done = true;
          item.doneDate = chosenDate;
        }
        state.pendingDoneToggle = null;
      });
      if (item) commitOps([{ ref: (kind === "despesa" ? despesaDocRef : receitaDocRef)(id), type: "set", data: { done: true, doneDate: chosenDate }, merge: true }]);
    });

  function captureTransferDraft() {
    if (!state.transferModal) return;
    const outEl = document.getElementById("transfer-out-value");
    const inEl = document.getElementById("transfer-in-value");
    const dateEl = document.getElementById("transfer-date");
    if (outEl) state.transferModal.outValue = outEl.value;
    if (inEl) state.transferModal.inValue = inEl.value;
    if (dateEl) state.transferModal.date = dateEl.value;
  }

  const openTransferBtn = shell.querySelector('[data-action="open-transfer-modal"]');
  if (openTransferBtn)
    openTransferBtn.addEventListener("click", () => {
      const accountNames = [...state.accounts.BRL, ...state.accounts.PEN].map((a) => a.name);
      state.transferModal = {
        originAccount: accountNames[0] || "",
        destAccount: accountNames[1] || accountNames[0] || "",
        outValue: "",
        inValue: "",
        date: todayStr(),
      };
      state.transferError = "";
      state.showFabMenu = false;
      render();
    });

  shell.querySelectorAll('[data-action="cancel-transfer"]').forEach((el) =>
    el.addEventListener("click", () => {
      state.transferModal = null;
      state.transferError = "";
      render();
    })
  );

  const transferOriginSel = shell.querySelector('[data-action="transfer-set-origin"]');
  if (transferOriginSel)
    transferOriginSel.addEventListener("change", (e) => {
      captureTransferDraft();
      state.transferModal.originAccount = e.target.value;
      render();
    });

  const transferDestSel = shell.querySelector('[data-action="transfer-set-dest"]');
  if (transferDestSel)
    transferDestSel.addEventListener("change", (e) => {
      captureTransferDraft();
      state.transferModal.destAccount = e.target.value;
      render();
    });

  const confirmTransferBtn = shell.querySelector('[data-action="confirm-transfer"]');
  if (confirmTransferBtn)
    confirmTransferBtn.addEventListener("click", () => {
      const t = state.transferModal;
      const originAccount = t.originAccount;
      const destAccount = t.destAccount;
      const outValue = parseFloat(document.getElementById("transfer-out-value").value) || 0;
      const inValue = parseFloat(document.getElementById("transfer-in-value").value) || 0;
      const date = document.getElementById("transfer-date").value || todayStr();

      captureTransferDraft();

      if (!originAccount || !destAccount) {
        state.transferError = "Selecione as duas contas.";
        render();
        return;
      }
      if (originAccount === destAccount) {
        state.transferError = "A conta de origem e destino precisam ser diferentes.";
        render();
        return;
      }
      if (outValue <= 0 || inValue <= 0) {
        state.transferError = "Informe os dois valores (maiores que zero).";
        render();
        return;
      }

      const transferId = uid("transfer");
      const despesaItem = {
        id: uid("despesa"),
        account: originAccount,
        description: `Transferência para ${destAccount}`,
        dueDate: date,
        value: outValue,
        done: true,
        doneDate: date,
        isTransfer: true,
        transferId,
      };
      const receitaItem = {
        id: uid("receita"),
        account: destAccount,
        description: `Transferência de ${originAccount}`,
        dueDate: date,
        value: inValue,
        done: true,
        doneDate: date,
        isTransfer: true,
        transferId,
      };

      applyLocal(() => {
        state.despesas.push(despesaItem);
        state.receitas.push(receitaItem);
        state.transferModal = null;
        state.transferError = "";
      });
      commitOps([
        { ref: despesaDocRef(despesaItem.id), type: "set", data: despesaItem },
        { ref: receitaDocRef(receitaItem.id), type: "set", data: receitaItem },
      ]);
    });

  shell.querySelectorAll("[data-edit]").forEach((input) =>
    input.addEventListener("change", (e) => {
      const { edit, kind, id } = input.dataset;
      const list = kind === "despesa" ? state.despesas : state.receitas;
      const item = list.find((i) => i.id === id);
      if (!item) return;
      const newValue = edit === "value" ? parseFloat(e.target.value) || 0 : e.target.value;
      applyLocal(() => {
        item[edit] = newValue;
      });
      commitOps([{ ref: (kind === "despesa" ? despesaDocRef : receitaDocRef)(id), type: "set", data: { [edit]: newValue }, merge: true }]);
    })
  );

  shell.querySelectorAll('[data-action="delete-item"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const { kind, id } = btn.dataset;
      const list = kind === "despesa" ? state.despesas : state.receitas;
      const item = list.find((i) => i.id === id);
      const transferId = item && item.isTransfer ? item.transferId : null;
      const pairedDespesaIds = transferId ? state.despesas.filter((i) => i.transferId === transferId && i.id !== id).map((i) => i.id) : [];
      const pairedReceitaIds = transferId ? state.receitas.filter((i) => i.transferId === transferId && i.id !== id).map((i) => i.id) : [];
      applyLocal(() => {
        if (kind === "despesa") state.despesas = state.despesas.filter((i) => i.id !== id);
        else state.receitas = state.receitas.filter((i) => i.id !== id);
        if (transferId) {
          // apaga a outra ponta da transferência também, para não deixar órfã
          state.despesas = state.despesas.filter((i) => i.transferId !== transferId);
          state.receitas = state.receitas.filter((i) => i.transferId !== transferId);
        }
      });
      const ops = [{ ref: (kind === "despesa" ? despesaDocRef : receitaDocRef)(id), type: "delete" }];
      pairedDespesaIds.forEach((pid) => ops.push({ ref: despesaDocRef(pid), type: "delete" }));
      pairedReceitaIds.forEach((pid) => ops.push({ ref: receitaDocRef(pid), type: "delete" }));
      commitOps(ops);
    })
  );

  shell.querySelectorAll("[data-edit-acc]").forEach((input) =>
    input.addEventListener("change", (e) => {
      const { editAcc, currency, id } = input.dataset;
      const acc = state.accounts[currency].find((a) => a.id === id);
      if (!acc) return;
      const newValue = editAcc === "initial" ? parseFloat(e.target.value) || 0 : e.target.value;
      applyLocal(() => {
        acc[editAcc] = newValue;
      });
      commitOps([{ ref: contaDocRef(id), type: "set", data: { [editAcc]: newValue }, merge: true }]);
    })
  );

  shell.querySelectorAll('[data-action="delete-account"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const { currency, id } = btn.dataset;
      applyLocal(() => {
        state.accounts[currency] = state.accounts[currency].filter((a) => a.id !== id);
      });
      commitOps([{ ref: contaDocRef(id), type: "delete" }]);
    })
  );

  shell.querySelectorAll('[data-action="add-account"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const { currency } = btn.dataset;
      const newAcc = { id: uid("acc"), name: "Nova conta", initial: 0, initialDate: todayStr() };
      applyLocal(() => {
        state.accounts[currency].push(newAcc);
        state.openAccounts.add(`${currency}-${newAcc.id}`);
      });
      commitOps([{ ref: contaDocRef(newAcc.id), type: "set", data: { ...newAcc, currency } }]);
    })
  );

  const exportBtn = shell.querySelector('[data-action="export-data"]');
  if (exportBtn)
    exportBtn.addEventListener("click", () => {
      const payload = JSON.stringify({ accounts: state.accounts, rate: state.rate, despesas: state.despesas, receitas: state.receitas }, null, 2);
      const blob = new Blob([payload], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `controle-financeiro-${todayStr()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    });

  const importBtn = shell.querySelector('[data-action="import-data"]');
  const importInput = shell.querySelector("#import-file-input");
  if (importBtn && importInput) {
    importBtn.addEventListener("click", () => importInput.click());
    importInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        try {
          const data = JSON.parse(reader.result);
          const newAccounts = data.accounts || state.accounts;
          const newRate = typeof data.rate === "number" ? data.rate : state.rate;
          const newDespesas = data.despesas || state.despesas;
          const newReceitas = data.receitas || state.receitas;

          state.syncStatus = "saving";
          render();

          // isso substitui TUDO: apaga o que existe hoje nas 3 coleções e grava os dados importados
          const [oldDespesas, oldReceitas, oldContas] = await Promise.all([despesasColRef.get(), receitasColRef.get(), contasColRef.get()]);
          const ops = [];
          oldDespesas.forEach((doc) => ops.push({ ref: doc.ref, type: "delete" }));
          oldReceitas.forEach((doc) => ops.push({ ref: doc.ref, type: "delete" }));
          oldContas.forEach((doc) => ops.push({ ref: doc.ref, type: "delete" }));
          newDespesas.forEach((d) => ops.push({ ref: despesaDocRef(d.id), type: "set", data: d }));
          newReceitas.forEach((r) => ops.push({ ref: receitaDocRef(r.id), type: "set", data: r }));
          [...(newAccounts.BRL || []).map((a) => ({ ...a, currency: "BRL" })), ...(newAccounts.PEN || []).map((a) => ({ ...a, currency: "PEN" }))].forEach((a) =>
            ops.push({ ref: contaDocRef(a.id), type: "set", data: a })
          );
          ops.push({ ref: docRef, type: "set", data: { rate: newRate }, merge: true });

          applyLocal(() => {
            state.accounts = newAccounts;
            state.rate = newRate;
            state.despesas = newDespesas;
            state.receitas = newReceitas;
          });
          await commitOpsChunked(ops);
        } catch (err) {
          console.error(err);
          alert("Arquivo inválido.");
        }
      };
      reader.readAsText(file);
    });
  }

  const exportCsvBtn = shell.querySelector('[data-action="export-csv"]');
  if (exportCsvBtn)
    exportCsvBtn.addEventListener("click", () => {
      const csv = buildCsvExport();
      const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `controle-financeiro-${todayStr()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
    });

  const importCsvBtn = shell.querySelector('[data-action="import-csv"]');
  const importCsvInput = shell.querySelector("#import-csv-input");
  if (importCsvBtn && importCsvInput) {
    importCsvBtn.addEventListener("click", () => importCsvInput.click());
    importCsvInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const { novasDespesas, novasReceitas, contasUpsert, novaTaxa, ignoradas } = parseCsvImport(reader.result);
          if (novasDespesas.length === 0 && novasReceitas.length === 0 && contasUpsert.length === 0 && novaTaxa === null) {
            alert("Nenhuma linha válida encontrada no CSV.");
            return;
          }

          const ops = [];
          const accountIndexBefore = buildAccountIndex(state.accounts);

          applyLocal(() => {
            contasUpsert.forEach((c) => {
              const existing = accountIndexBefore[c.name];
              if (existing) {
                // já existe uma conta com esse nome: atualiza os dados dela
                const arr = state.accounts[existing.currency];
                const acc = arr.find((a) => a.id === existing.id);
                if (acc) {
                  acc.initial = c.initial;
                  acc.initialDate = c.initialDate;
                }
                ops.push({ ref: contaDocRef(existing.id), type: "set", data: { initial: c.initial, initialDate: c.initialDate }, merge: true });
              } else {
                const newAcc = { id: uid("acc"), name: c.name, initial: c.initial, initialDate: c.initialDate };
                state.accounts[c.currency].push(newAcc);
                ops.push({ ref: contaDocRef(newAcc.id), type: "set", data: { ...newAcc, currency: c.currency } });
              }
            });

            if (novaTaxa !== null) {
              state.rate = novaTaxa;
              ops.push({ ref: docRef, type: "set", data: { rate: novaTaxa }, merge: true });
            }

            state.despesas.push(...novasDespesas);
            state.receitas.push(...novasReceitas);
          });

          novasDespesas.forEach((d) => ops.push({ ref: despesaDocRef(d.id), type: "set", data: d }));
          novasReceitas.forEach((r) => ops.push({ ref: receitaDocRef(r.id), type: "set", data: r }));
          commitOps(ops);

          const partes = [];
          if (contasUpsert.length) partes.push(`${contasUpsert.length} conta(s)`);
          if (novaTaxa !== null) partes.push("taxa de câmbio");
          if (novasDespesas.length) partes.push(`${novasDespesas.length} despesa(s)`);
          if (novasReceitas.length) partes.push(`${novasReceitas.length} receita(s)`);
          alert(`Importado: ${partes.join(", ")}.${ignoradas ? ` ${ignoradas} linha(s) ignorada(s) por dados incompletos.` : ""}`);
        } catch (err) {
          console.error(err);
          alert("Não foi possível ler esse CSV. Confira se o formato é o mesmo do exportado por aqui.");
        }
        importCsvInput.value = "";
      };
      reader.readAsText(file, "utf-8");
    });
  }

  shell.querySelectorAll('[data-action="set-theme"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      const theme = btn.dataset.theme;
      state.themePreference = theme;
      applyTheme(theme);
      setStoredTheme(theme);
      render();
    })
  );

  shell.querySelectorAll('[data-action="toggle-fab-menu"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.showFabMenu = !state.showFabMenu;
      render();
    })
  );
  shell.querySelectorAll('[data-action="close-fab-menu"]').forEach((el) =>
    el.addEventListener("click", () => {
      state.showFabMenu = false;
      render();
    })
  );
  shell.querySelectorAll('[data-action="fab-new-despesa"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.tab = "despesas";
      state.showDespesaForm = true;
      state.showFabMenu = false;
      render();
    })
  );
  shell.querySelectorAll('[data-action="fab-new-receita"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.tab = "receitas";
      state.showReceitaForm = true;
      state.showFabMenu = false;
      render();
    })
  );

  const logoutBtn = shell.querySelector('[data-action="logout"]');
  if (logoutBtn) logoutBtn.addEventListener("click", () => auth.signOut());

  shell.querySelectorAll('[data-action="toggle-change-password"]').forEach((btn) =>
    btn.addEventListener("click", () => {
      state.showChangePasswordForm = !state.showChangePasswordForm;
      state.changePasswordMsg = "";
      render();
    })
  );

  const submitChangePwdBtn = shell.querySelector('[data-action="submit-change-password"]');
  if (submitChangePwdBtn)
    submitChangePwdBtn.addEventListener("click", () => {
      const current = document.getElementById("cp-current").value;
      const next = document.getElementById("cp-new").value;
      const confirm = document.getElementById("cp-confirm").value;
      if (!current || !next || !confirm) {
        state.changePasswordMsg = "Preencha todos os campos.";
        state.changePasswordMsgOk = false;
        render();
        return;
      }
      if (next !== confirm) {
        state.changePasswordMsg = "A nova senha e a confirmação não coincidem.";
        state.changePasswordMsgOk = false;
        render();
        return;
      }
      if (next.length < 6) {
        state.changePasswordMsg = "A nova senha precisa ter pelo menos 6 caracteres.";
        state.changePasswordMsgOk = false;
        render();
        return;
      }
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, current);
      currentUser
        .reauthenticateWithCredential(cred)
        .then(() => currentUser.updatePassword(next))
        .then(() => {
          state.changePasswordMsg = "Senha alterada com sucesso.";
          state.changePasswordMsgOk = true;
          render();
        })
        .catch((err) => {
          console.error(err);
          state.changePasswordMsg = traduzErroAuth(err.code);
          state.changePasswordMsgOk = false;
          render();
        });
    });
}

/* ------------------------------ login / autenticação ------------------------------ */

function traduzErroAuth(code) {
  const map = {
    "auth/invalid-email": "E-mail inválido.",
    "auth/user-not-found": "Usuário não encontrado. Confira se essa conta foi criada em Authentication → Users.",
    "auth/wrong-password": "Senha incorreta.",
    "auth/invalid-credential": "E-mail ou senha incorretos.",
    "auth/too-many-requests": "Muitas tentativas. Aguarde um pouco e tente de novo.",
    "auth/network-request-failed": "Sem conexão com a internet para entrar.",
    "auth/operation-not-allowed": "Login por e-mail/senha ainda não está ativado no Firebase (Authentication → Sign-in method).",
    "auth/user-disabled": "Esse usuário foi desativado no Firebase.",
    "auth/missing-password": "Digite a senha.",
    "auth/weak-password": "A nova senha precisa ter pelo menos 6 caracteres.",
    "auth/requires-recent-login": "Por segurança, confirme a senha atual corretamente para trocar a senha.",
  };
  return `${map[code] || "Não foi possível concluir."} (código: ${code || "desconhecido"})`;
}

function renderLoginScreen(errorMsg, prefillEmail, infoMsg) {
  document.body.classList.add("login-mode");
  const shell = document.getElementById("app-shell");
  shell.innerHTML = `
    <div class="login-wrap">
      <div class="login-card">
        <div class="login-logo">R$</div>
        <div class="login-title">Controle Financeiro</div>
        <div class="login-subtitle">Acesse suas finanças com simplicidade</div>
        <div class="login-field-row"><div class="field-label">E-mail</div><input type="text" id="login-email" inputmode="email" autocomplete="username" value="${esc(prefillEmail || "")}"/></div>
        <div class="login-field-row">
          <div class="field-label">Senha</div>
          <div class="password-wrap">
            <input type="password" id="login-password" autocomplete="current-password"/>
            <button type="button" class="password-toggle" id="toggle-login-password" aria-label="Mostrar senha">${ICONS.eye}</button>
          </div>
        </div>
        ${errorMsg ? `<div style="color:var(--danger);font-size:12.5px;margin-top:6px;text-align:left">${esc(errorMsg)}</div>` : ""}
        ${infoMsg ? `<div style="color:var(--brl);font-size:12.5px;margin-top:6px;text-align:left">${esc(infoMsg)}</div>` : ""}
        <button class="add-btn" id="login-submit" style="width:100%;justify-content:center;margin-top:18px;padding:12px 0;font-size:14px">Entrar</button>
        <button class="login-forgot-link" id="forgot-password">Esqueci minha senha</button>
      </div>
    </div>`;
  document.getElementById("login-submit").addEventListener("click", doLogin);
  document.getElementById("forgot-password").addEventListener("click", doForgotPassword);
  const pwdInput = document.getElementById("login-password");
  const pwdToggle = document.getElementById("toggle-login-password");
  pwdToggle.addEventListener("click", () => {
    const showing = pwdInput.type === "text";
    pwdInput.type = showing ? "password" : "text";
    pwdToggle.innerHTML = showing ? ICONS.eye : ICONS.eyeOff;
  });
  shell.querySelectorAll("#login-email, #login-password").forEach((el) =>
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    })
  );
  if (prefillEmail) document.getElementById("login-password").focus();
}

function doLogin() {
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  if (!email || !password) return;
  const btn = document.getElementById("login-submit");
  btn.textContent = "Entrando…";
  auth.signInWithEmailAndPassword(email, password).catch((err) => {
    console.error(err);
    renderLoginScreen(traduzErroAuth(err.code), email);
  });
}

function doForgotPassword() {
  const email = document.getElementById("login-email").value.trim();
  if (!email) {
    renderLoginScreen("Digite seu e-mail acima primeiro, depois toque em \"Esqueci minha senha\".", email);
    return;
  }
  const btn = document.getElementById("forgot-password");
  btn.textContent = "Enviando…";
  auth
    .sendPasswordResetEmail(email)
    .then(() => {
      renderLoginScreen(null, email, `Enviamos um e-mail para ${email} com um link para você criar uma nova senha. Confira também a caixa de spam.`);
    })
    .catch((err) => {
      console.error(err);
      renderLoginScreen(traduzErroAuth(err.code), email);
    });
}

auth.onAuthStateChanged((user) => {
  if (user) {
    currentUser = user;
    docRef = db.collection("controle-financeiro").doc(user.uid);
    state.ready = false;
    document.body.classList.remove("login-mode");
    render();
    startFirestoreSync();
  } else {
    currentUser = null;
    docRef = null;
    state.ready = false;
    renderLoginScreen();
  }
});

/* ------------------------------ boot ------------------------------ */

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch((e) => console.warn("Service worker não registrado", e));
  });
}
</script>
